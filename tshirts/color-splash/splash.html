<!doctype html>
<meta charset="utf-8">
<title>Color Splash Tee</title>
<link rel="stylesheet" href="../fonts/wordmark-fonts.css">
<script src="logos.js"></script>
<style>html,body{margin:0;background:#222}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
// All-over print panel for the color-splash tee: a dark shirt with bright, square paint splotches,
// chips and drips, and (on the front) a large outline Coma Toast mark centered on the chest.
// Query options, e.g. splash.html?panel=front&seed=3&w=3000&h=4000&s=1.2&cw=hot-wire&logo=1500,1100,1250
//   panel  front | back | sleeve   (sets how heavy and where the splatter goes)
//   w, h   layout size in design units; s = pixels per design unit
//   cw     logo colorway key from logos.js; logo = x,y,width[,height] of the mark's visible area (design
//          units); a height stretches the mark lengthwise (with only=logo it just sets the proportions)
//   cw also sets the paint palette (the colorway's colors plus white), on every panel
//   wm     wordmark font key (see WORDMARK_FONTS); draws $Daily Bread$ at the bottom right (back)
//   only=logo | only=wordmark  renders just that on a transparent background; hide=1 leaves the logo off
const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || 3000), H = +(Q.get('h') || 4000), S = +(Q.get('s') || 1);
const PANEL = Q.get('panel') || 'front';
const WM = Q.get('wm');
const CW = window.LOGOS[Q.get('cw') || 'hot-wire'];
const LOGO = Q.get('logo') ? Q.get('logo').split(',').map(Number) : null;
const ONLY_LOGO = Q.get('only') === 'logo', ONLY_WM = Q.get('only') === 'wordmark';
const cv = document.getElementById('c'); cv.width = Math.round(W * S); cv.height = Math.round(H * S);
const ctx = cv.getContext('2d'); ctx.scale(S, S);

let seed = +(Q.get('seed') || 7);
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = (a, b) => a + rnd() * (b - a);
const pick = a => a[Math.floor(rnd() * a.length)];

const BASE = '#121214';
// The paint palette follows the colorway: its toast color and accent color, plus white.
const WHITE = '#f4f4f2';
const PAINT = [CW.primary, CW.accent, CW.primary, CW.accent, WHITE];

// Candidate fonts for the $Daily Bread$ back wordmark (files in ../fonts/wordmark-fonts.css).
const WORDMARK_FONTS = {
  blackletter: { name: 'Pirata One', css: '400 100px "Pirata One"' },
  couture: { name: 'Bodoni Moda Black Italic', css: 'italic 800 100px "Bodoni Moda"' },
  neon: { name: 'Monoton', css: '400 100px "Monoton"' },
  pixel: { name: 'Press Start 2P', css: '400 100px "Press Start 2P"' },
  signature: { name: 'Mr Dafoe', css: '400 100px "Mr Dafoe"', gap: 14 },
  block: { name: 'Rubik Mono One', css: '400 100px "Rubik Mono One"' },
  // Graffiti, and graffiti crossed with pixels. pixel: rebuilt from square cells (cells per cap
  // height); drips: square drips under the letters; shadow: a 3D drop shadow in the other color.
  'wet-paint': { name: 'Rubik Wet Paint', css: '400 100px "Rubik Wet Paint"' },
  'spray': { name: 'Rubik Spray Paint', css: '400 100px "Rubik Spray Paint"' },
  'handstyle': { name: 'Sedgwick Ave Display', css: '400 100px "Sedgwick Ave Display"', gap: 6 },
  'throw-up': { name: 'Knewave', css: '400 100px "Knewave"', shadow: true, gap: 4 },
  'pixel-tag': { name: 'Sedgwick Ave Display, pixelated', css: '400 100px "Sedgwick Ave Display"', gap: 6, pixel: 22 },
  'pixel-drip': { name: 'Knewave, pixelated', css: '400 100px "Knewave"', gap: 4, pixel: 13, drips: true },
  'pixel-throw': { name: 'Bangers, pixelated, 3D', css: '400 100px "Bangers"', gap: 8, pixel: 18, shadow: true, track: 0.07 },
};
const WM_TEXT = ['$', 'Daily Bread', '$'];
// Back wordmark: right edge in design units (about 3.8 in in from the right edge of the panel), 5.6 in
// wide, set as low as it can go: its lowest point (drips included) sits WM_HEM_CLEAR above the bottom
// of the panel, which is 1.5 in of clearance for the hem fold and print trim (125 units = 1 in).
const WM_RIGHT = 2520, WM_W = 700, WM_HEM_CLEAR = 190;
let WM_BASE = 3600;

// Measure the wordmark at a given width: returns the font string and per-piece widths.
function wordmarkLayout(key, width) {
  const f = WORDMARK_FONTS[key];
  ctx.font = f.css; ctx.letterSpacing = (f.track || 0) * 100 + 'px';
  // gap (at 100px) adds air between the words and the dollar signs, for scripts that run into them
  const widths = WM_TEXT.map((t, i) => ctx.measureText(t).width + (i < 2 ? f.gap || 0 : 0)), total = widths.reduce((a, b) => a + b, 0);
  const k = width / total, px = 100 * k;
  ctx.font = f.css.replace('100px', px + 'px'); ctx.letterSpacing = (f.track || 0) * px + 'px';
  const m = ctx.measureText(WM_TEXT.join(''));
  const cap = ctx.measureText('D').actualBoundingBoxAscent, track = ctx.letterSpacing;
  ctx.letterSpacing = '0px';
  return { f, font: ctx.font, track, px, cap, widths: widths.map(w => w * k), ascent: m.actualBoundingBoxAscent, descent: m.actualBoundingBoxDescent };
}
// Draws $Daily Bread$ with its left end at x and baseline at y: the words in the toast color and the
// dollar signs in the accent color.
function drawWordmark(L, x, y) {
  const colorOf = i => (i === 1 ? CW.primary : CW.accent);
  const textAt = (dx, dy, color) => {
    let cx = x + dx;
    WM_TEXT.forEach((t, i) => { ctx.fillStyle = color ? color(i) : colorOf(i); ctx.fillText(t, cx, y + dy); cx += L.widths[i]; });
  };
  ctx.textBaseline = 'alphabetic';
  if (!L.f.pixel) {
    ctx.font = L.font; ctx.letterSpacing = L.track;
    if (L.f.shadow) { const d = L.px * 0.06; for (let k = d; k > 0; k -= Math.max(1, d / 12)) textAt(k, k, i => (i === 1 ? CW.accent : CW.primary)); }
    textAt(0, 0);
    ctx.letterSpacing = '0px';
    return;
  }
  // Pixel versions: draw the lettering on a scratch canvas, then rebuild it from square cells.
  const cell = L.cap / L.f.pixel, gapC = cell * 0.12, total = L.widths.reduce((a, b) => a + b, 0);
  const pad = Math.ceil(L.px * 0.6), sw = Math.ceil(total + 2 * pad), sh = Math.ceil(L.px * 1.6 + 2 * pad);
  const sc = document.createElement('canvas'); sc.width = sw; sc.height = sh;
  const sx = sc.getContext('2d'); sx.font = L.font; sx.letterSpacing = L.track; sx.textBaseline = 'alphabetic';
  const base = pad + L.px;
  let cx = pad;
  WM_TEXT.forEach((t, i) => { sx.fillStyle = colorOf(i); sx.fillText(t, cx, base); cx += L.widths[i]; });
  const data = sx.getImageData(0, 0, sw, sh).data;
  const ox = x - pad, oy = y - base, cols = Math.floor(sw / cell), rows = Math.floor(sh / cell);
  const bottoms = new Map(), cells = [];
  for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
    const px = Math.floor((c + 0.5) * cell), py = Math.floor((r + 0.5) * cell), o = (py * sw + px) * 4;
    if (data[o + 3] < 128) continue;
    const isPrimary = Math.abs(data[o] - parseInt(CW.primary.slice(1, 3), 16)) + Math.abs(data[o + 1] - parseInt(CW.primary.slice(3, 5), 16)) < 60;
    cells.push([c, r, `rgb(${data[o]},${data[o + 1]},${data[o + 2]})`, isPrimary]);
  }
  // 3D: a one-cell block shadow in the other color
  if (L.f.shadow) for (const k of [1]) for (const [c, r, , isP] of cells) {
    ctx.fillStyle = isP ? CW.accent : CW.primary;
    ctx.fillRect(ox + (c + k) * cell + gapC / 2, oy + (r + k) * cell + gapC / 2, cell - gapC, cell - gapC);
  }
  for (const [c, r, color] of cells) {
    ctx.fillStyle = color;
    ctx.fillRect(ox + c * cell + gapC / 2, oy + r * cell + gapC / 2, cell - gapC, cell - gapC);
    bottoms.set(c, { r, color });
  }
  // Square drips: a few columns run down from the bottom of the letters (seeded, so stable per file).
  if (L.f.drips) {
    let ds = 97;
    const dr = () => { ds = (ds * 16807) % 2147483647; return ds / 2147483647; };
    for (const [c, { r, color }] of bottoms) {
      if (dr() > 0.16) continue;
      ctx.fillStyle = color;
      const len = 1 + Math.floor(dr() * 4);
      for (let k = 1; k <= len; k++) ctx.fillRect(ox + c * cell + gapC / 2, oy + (r + k) * cell + gapC / 2, cell - gapC, cell - gapC);
    }
  }
}

// A rough-edged quad: four corners, with small jitter along each edge so it reads as paint, not vector.
function roughRect(x, y, w, h, a, rough) {
  const c = Math.cos(a), sn = Math.sin(a), P = (u, v) => [x + u * c - v * sn, y + u * sn + v * c];
  const corners = [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]];
  ctx.beginPath();
  corners.forEach((p, i) => {
    const q = corners[(i + 1) % 4], steps = 6;
    for (let k = 0; k < steps; k++) {
      const t = k / steps, j = k ? R(-rough, rough) : 0;
      const u = p[0] + (q[0] - p[0]) * t, v = p[1] + (q[1] - p[1]) * t;
      // push the jitter outward from the edge (perpendicular to it)
      const nx = (q[1] - p[1]) ? Math.sign(q[1] - p[1]) : 0, ny = (q[0] - p[0]) ? -Math.sign(q[0] - p[0]) : 0;
      const pt = P(u + nx * j, v + ny * j);
      k || i ? ctx.lineTo(...pt) : ctx.moveTo(...pt);
    }
  });
  ctx.closePath(); ctx.fill();
}

// One square splotch: a chunky, slightly tilted block of paint, sometimes with a second color
// knocked off-register behind it, a scatter of little square chips, and a few square-ended drips.
function block(x, y, r, color, alt) {
  const a = R(-0.22, 0.22), w = r * R(1.5, 2.1), h = w * R(0.8, 1.15);
  if (alt) { ctx.fillStyle = alt; roughRect(x + r * R(-0.4, 0.4), y + r * R(-0.4, 0.4), w * R(0.55, 0.85), h * R(0.55, 0.85), a + R(-0.25, 0.25), r * 0.03); }
  ctx.fillStyle = color;
  roughRect(x, y, w, h, a, r * 0.035);
  // chips: small squares thrown off the block, smaller the further out
  const chips = Math.round(R(10, 22));
  for (let i = 0; i < chips; i++) {
    const ang = R(0, Math.PI * 2), d = r * R(1.25, 2.9), s = r * R(0.06, 0.24) * (1.5 - d / (r * 2.9));
    roughRect(x + Math.cos(ang) * d, y + Math.sin(ang) * d, s, s, a + R(-0.3, 0.3), s * 0.04);
  }
  // drips: straight runs off the bottom edge, ending in a small square
  const drips = Math.round(R(0, 3));
  for (let i = 0; i < drips; i++) {
    const dx = x + R(-0.42, 0.42) * w, top = y + h * 0.4, len = r * R(0.6, 2.2), dw = r * R(0.09, 0.17);
    ctx.fillRect(dx - dw / 2, top, dw, len);
    ctx.fillRect(dx - dw * 0.8, top + len - dw * 0.4, dw * 1.6, dw * 1.6);
  }
}

// A trail of shrinking squares, like a dragged brush breaking up.
function trail(x, y, len, a, s, color) {
  ctx.fillStyle = color;
  for (let d = 0, k = s; d < len && k > 4; d += k * R(1.3, 1.9), k *= R(0.8, 0.92)) {
    const off = R(-0.25, 0.25) * s;
    roughRect(x + Math.cos(a) * d - Math.sin(a) * off, y + Math.sin(a) * d + Math.cos(a) * off, k, k, a + R(-0.2, 0.2), k * 0.04);
  }
}

// Fine square "pixel" spray around a point.
function mist(x, y, r, color, n) {
  ctx.fillStyle = color;
  for (let i = 0; i < n; i++) {
    const a = R(0, Math.PI * 2), d = r * Math.sqrt(rnd()), s = R(3, 9);
    ctx.fillRect(x + Math.cos(a) * d - s / 2, y + Math.sin(a) * d - s / 2, s, s);
  }
}

function loadLogo() {
  return new Promise((ok, fail) => {
    const img = new Image(); img.onload = () => ok(img); img.onerror = fail;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(CW.svg);
  });
}
// LOGO_BOX is the mark's visible area inside its 200-unit square; w is the visible width on the shirt.
const BOX = window.LOGO_BOX;
function drawLogo(img, x, y, w, h) {
  const ux = w / BOX.w, uy = (h || w * BOX.h / BOX.w) / BOX.h;
  ctx.drawImage(img, x - BOX.cx * ux, y - BOX.cy * uy, 200 * ux, 200 * uy);
}

// Keep paint away from the chest logo (an oval clear zone) and the back wordmark (a box around it).
let WM_ZONE = null;
// The logo sits in a clean dark window (a rounded rectangle LOGO_MARGIN outside the mark), so the
// paint frames it as the centerpiece. Paint is also clipped to stay out of the window.
const LOGO_MARGIN = 190, LOGO_CLIP = 140, LOGO_RADIUS = 220;
const logoRect = m => {
  const [lx, ly, lw] = LOGO, lh = LOGO[3] || lw * BOX.h / BOX.w;
  return [lx - lw / 2 - m, ly - lh / 2 - m, lx + lw / 2 + m, ly + lh / 2 + m];
};
function clear(x, y) {
  if (WM_ZONE && x > WM_ZONE[0] && x < WM_ZONE[2] && y > WM_ZONE[1] && y < WM_ZONE[3]) return false;
  if (!LOGO) return true;
  const z = logoRect(LOGO_MARGIN);
  return !(x > z[0] && x < z[2] && y > z[1] && y < z[3]);
}
const clearAround = (x, y, m) => clear(x, y) && clear(x + m, y) && clear(x - m, y) && clear(x, y - m) && clear(x, y + m)
  && clear(x + m, y + m) && clear(x - m, y + m) && clear(x + m, y - m) && clear(x - m, y - m);

(async function compose() {
  const img = (LOGO || ONLY_LOGO) ? await loadLogo() : null;
  if (ONLY_LOGO) {
    const aspect = LOGO && LOGO[3] ? LOGO[2] / LOGO[3] : BOX.w / BOX.h, w = Math.min(W * 0.86, H * 0.86 * aspect);
    drawLogo(img, W / 2, H / 2, w, w / aspect); window.DONE = true; return;
  }
  if (WM) await document.fonts.load(WORDMARK_FONTS[WM].css, WM_TEXT.join(''));
  if (ONLY_WM) {
    const L = wordmarkLayout(WM, W * 0.92), h = L.ascent + L.descent;
    drawWordmark(L, W * 0.04, H / 2 + h / 2 - L.descent); window.DONE = true; return;
  }
  let wmLayout = null;
  if (WM) {
    wmLayout = wordmarkLayout(WM, WM_W);
    WM_BASE = H - WM_HEM_CLEAR - wmLayout.descent;
    const pad = 110;
    WM_ZONE = [WM_RIGHT - WM_W - pad, WM_BASE - wmLayout.ascent - pad, WM_RIGHT + pad, WM_BASE + wmLayout.descent + pad];
  }

  ctx.fillStyle = BASE; ctx.fillRect(0, 0, W, H);

  // Where the paint lands. Front: heavy all around a clean dark window that frames the chest logo. Back: two mid-sized blocks plus scatter, clear of the wordmark.
  // Sleeves: a few splotches from the cuff and the shoulder.
  const plan = [];
  if (PANEL === 'front') {
    let ring = 0;
    for (let i = 0; i < 1200 && plan.length < 38; i++) {
      // left/right alternate so both sides of the chest get the same amount of paint
      const edge = pick(['side', 'hem', 'shoulder', 'any', 'frame', 'frame']);
      let x = edge === 'side' ? (i % 2 ? R(W * 0.07, W * 0.26) : R(W * 0.74, W * 0.93)) : edge === 'shoulder' ? pick([R(0, W * 0.3), R(W * 0.7, W)]) : R(0, W);
      let y = edge === 'hem' ? R(H * 0.62, H) : edge === 'shoulder' ? R(0, H * 0.2) : edge === 'any' ? R(0, H) : R(H * 0.1, H);
      const r = R(60, 210);
      if (edge === 'frame' && LOGO) {
        // just outside the logo window, anywhere around its edge, so the paint rings the logo
        // spread evenly around the window (golden-ratio steps along its perimeter)
        ring = (ring + 0.618034) % 1;
        const z = logoRect(LOGO_MARGIN + r * 1.2 + R(0, 160)), w = z[2] - z[0], h = z[3] - z[1], t = ring * 2 * (w + h);
        [x, y] = t < w ? [z[0] + t, z[1]] : t < w + h ? [z[2], z[1] + t - w] : t < 2 * w + h ? [z[2] - (t - w - h), z[3]] : [z[0], z[3] - (t - 2 * w - h)];
      }
      if (clearAround(x, y, r * 1.15)) plan.push([x, y, r]);
    }
  } else if (PANEL === 'back') {
    // Two mid-sized blocks staggered across the upper middle instead of one big one.
    plan.push([W * R(0.36, 0.42), H * R(0.26, 0.31), R(210, 250)]);
    plan.push([W * R(0.58, 0.64), H * R(0.42, 0.47), R(190, 230)]);
    for (let i = 0; i < 600 && plan.length < 34; i++) {
      const x = R(0, W), y = R(0, H), r = R(60, 200);
      if (clearAround(x, y, r * 1.15)) plan.push([x, y, r]);
    }
  } else {
    for (let i = 0; i < 11; i++) plan.push([R(0, W), R(0, H), R(60, 200)]);
  }

  // Stray chips and trails never cross the wordmark: clip a slightly smaller box out of the paint.
  ctx.save();
  if (WM_ZONE) { const z = WM_ZONE, p = 50; ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.rect(z[0] + p, z[1] + p, z[2] - z[0] - 2 * p, z[3] - z[1] - 2 * p); ctx.clip('evenodd'); }
  if (LOGO) { const z = logoRect(LOGO_CLIP); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.roundRect(z[0], z[1], z[2] - z[0], z[3] - z[1], LOGO_RADIUS); ctx.clip('evenodd'); }
  plan.forEach(([x, y, r], i) => {
    const color = PAINT[i % PAINT.length], alt = rnd() < 0.45 ? PAINT[(i + 2) % PAINT.length] : null;
    if (rnd() < 0.5) mist(x, y, r * 2.4, color, Math.round(r * 0.9));
    block(x, y, r, color, alt);
    if (rnd() < 0.55) trail(x, y, r * R(2.2, 4), R(0, Math.PI * 2), r * R(0.22, 0.34), color);
  });
  // Small chips and pixels sprinkled everywhere else (kept off the logo), so the front carries color all over.
  if (PANEL === 'front') {
    for (let i = 0; i < 260; i++) {
      const x = R(0, W), y = R(0, H), s = R(10, 46);
      if (!clear(x, y) || !clear(x + s * 2, y) || !clear(x - s * 2, y)) continue;
      ctx.fillStyle = pick(PAINT); roughRect(x, y, s, s, R(-0.3, 0.3), s * 0.05);
    }
  }

  ctx.restore();
  if (wmLayout) drawWordmark(wmLayout, WM_RIGHT - WM_W, WM_BASE);
  // hide=1 keeps the logo's clear zone but leaves the logo off (for layering a logo PNG in Printful)
  if (LOGO && !Q.get('hide')) drawLogo(img, LOGO[0], LOGO[1], LOGO[2], LOGO[3]);
  window.DONE = true;
})();
</script>
