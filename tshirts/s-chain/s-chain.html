<!doctype html>
<meta charset="utf-8">
<title>S-Chain Soda Stripes</title>
<style>html,body{margin:0;background:#444}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
// Front print: 90s soda-can racing stripes with a chain of interlocking "Cool S" notebook doodles.
// Transparent background so it prints on any shirt color. 12 x 12 in at 300 dpi.
const W = 3600, H = 3600;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');

let seed = 1994;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const INK = '#141019', CREAM = '#fff6e3', SHADOW = '#1d2a5c';
// Soda-can bands from the center line outward: [color, thickness]. Mirrored above and below.
const BANDS = [['#e1251b', 300], [CREAM, 22], ['#ffc20e', 70], [CREAM, 18], ['#f26a21', 46], [CREAM, 16], ['#00a19a', 34], [CREAM, 14], ['#6b3fa0', 22], [CREAM, 12], ['#1d2a5c', 12]];

function stripes(cy) {
  // Each band is a long capsule; the slight taper at the ends looks like the lines wrapping round a can.
  let off = 0;
  const draw = (y0, h, color) => {
    const inset = 120 + Math.abs(y0 + h / 2 - cy) * 0.35;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.roundRect(inset, y0, W - inset * 2, h, h / 2); ctx.fill();
  };
  const [c0, h0] = BANDS[0];
  draw(cy - h0 / 2, h0, c0); off = h0 / 2;
  for (let i = 1; i < BANDS.length; i++) {
    const [c, h] = BANDS[i];
    draw(cy + off, h, c); draw(cy - off - h, h, c);
    off += h;
  }
}

// Cool S on a 2 x 5 grid, centered on (0,0).
const OUT = [[1, 0], [2, 1], [2, 2], [1.5, 2.5], [2, 3], [2, 4], [1, 5], [0, 4], [0, 3], [0.5, 2.5], [0, 2], [0, 1]];
const INNER = [[[1, 1], [1, 2], [1.5, 2.5]], [[0.5, 2.5], [1, 3], [1, 4]]];
function sPath(u, pts, close) {
  ctx.beginPath();
  pts.forEach(([x, y], i) => { const px = (x - 1) * u, py = (y - 2.5) * u; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
  if (close) ctx.closePath();
}
function coolS(x, y, u, a, fill, lw) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // hard sticker shadow
  ctx.save(); ctx.translate(u * 0.12, u * 0.14); sPath(u, OUT, true); ctx.fillStyle = SHADOW; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = SHADOW; ctx.stroke(); ctx.restore();
  sPath(u, OUT, true); ctx.fillStyle = fill; ctx.fill();
  // marker shading on the "back" faces, the way kids shaded them
  ctx.save(); sPath(u, OUT, true); ctx.clip();
  ctx.fillStyle = 'rgba(20,16,25,0.12)';
  ctx.beginPath(); [[1, 0], [2, 1], [2, 2], [1.5, 2.5], [1, 2], [1, 1], [0, 1]].forEach(([px, py], i) => { const X = (px - 1) * u, Y = (py - 2.5) * u; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.closePath(); ctx.fill();
  ctx.beginPath(); [[1, 3], [2, 3], [2, 4], [1, 5], [1, 4]].forEach(([px, py], i) => { const X = (px - 1) * u, Y = (py - 2.5) * u; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = INK; ctx.lineWidth = lw;
  sPath(u, OUT, true); ctx.stroke();
  INNER.forEach(l => { sPath(u, l, false); ctx.stroke(); });
  ctx.restore();
}

const cy = H / 2;
stripes(cy);

// The chain: each S lies on its side and hooks into the next one. Drawing them in order and then
// re-drawing each S's top tip over its right-hand neighbour makes the links look woven together.
const N = 5, u = 150, gapX = 640, ang = 1.32; // S's lie on their side and hook tip to tip
const xs = Array.from({ length: N }, (_, i) => W / 2 + (i - (N - 1) / 2) * gapX);
const fills = [CREAM, '#ffc20e', CREAM, '#00a19a', CREAM];
xs.forEach((x, i) => coolS(x, cy, u, ang, fills[i], 30));
xs.forEach((x, i) => {
  if (i === N - 1) return;
  ctx.save();
  ctx.translate(x, cy); ctx.rotate(ang);
  ctx.beginPath(); ctx.rect(-u * 1.2, -u * 2.7, u * 2.4, u * 1.15); // the top hook of this S
  ctx.restore();
  ctx.save(); ctx.clip();
  coolS(x, cy, u, ang, fills[i], 30);
  ctx.restore();
});

window.DONE = true;
</script>
